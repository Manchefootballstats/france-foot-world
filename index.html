<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>France Foot World</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f6fb;
  color:#14213d;
}

/* HEADER */

header{
  background:linear-gradient(135deg,#061a40,#0b3d91,#2563eb);
  color:white;
}

.header-content{
  max-width:1150px;
  margin:auto;
  padding:38px 20px 30px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:34px;
  letter-spacing:.5px;
}

header p{
  margin:10px 0 0;
  color:#dbeafe;
  font-size:16px;
}

/* MENU */

nav{
  background:#06152f;
  border-top:1px solid rgba(255,255,255,.1);
}

.nav-content{
  max-width:1150px;
  margin:auto;
  display:flex;
  justify-content:center;
  gap:6px;
  padding:8px 15px;
}

.nav-btn{
  background:transparent;
  color:#dbeafe;
  border:0;
  padding:12px 18px;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
  font-weight:bold;
}

.nav-btn:hover,
.nav-btn.active{
  background:#2563eb;
  color:white;
}

/* MAIN */

main{
  max-width:1150px;
  margin:auto;
  padding:22px 20px 40px;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:25px;
}

.stat{
  background:white;
  padding:20px;
  border-radius:14px;
  text-align:center;
  box-shadow:0 4px 15px rgba(15,23,42,.07);
  border:1px solid #e5eaf2;
}

.stat strong{
  display:block;
  font-size:30px;
  color:#1d4ed8;
  margin-bottom:4px;
}

.stat span{
  color:#64748b;
  font-size:14px;
}

/* SEARCH */

.controls{
  background:white;
  padding:15px;
  border-radius:14px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:30px;
  box-shadow:0 3px 12px rgba(15,23,42,.05);
  border:1px solid #e5eaf2;
}

input,
select{
  flex:1;
  min-width:210px;
  padding:14px;
  border:1px solid #cbd5e1;
  border-radius:9px;
  font-size:15px;
  background:white;
  outline:none;
}

input:focus,
select:focus{
  border-color:#2563eb;
}

/* TITRES */

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:30px 0 15px;
}

.section-title h2{
  margin:0;
  font-size:22px;
}

.country-title{
  margin:28px 0 12px;
  font-size:20px;
  color:#0f2d5c;
  display:flex;
  align-items:center;
  gap:8px;
}

/* CHAMPIONNATS */

.leagues{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:14px;
}

.league{
  background:white;
  border:1px solid #dce5f2;
  border-radius:14px;
  padding:18px;
  cursor:pointer;
  text-align:left;
  color:#172554;
  transition:.2s;
  box-shadow:0 3px 10px rgba(15,23,42,.04);
}

.league:hover{
  transform:translateY(-3px);
  border-color:#2563eb;
  box-shadow:0 7px 18px rgba(37,99,235,.12);
}

.league-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.flag{
  font-size:28px;
}

.count{
  background:#eff6ff;
  color:#1d4ed8;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.league strong{
  display:block;
  font-size:17px;
  margin-bottom:6px;
}

.league small{
  color:#64748b;
}

/* JOUEURS */

.players-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:12px;
}

.player{
  background:white;
  padding:17px;
  border-radius:12px;
  border:1px solid #e2e8f0;
  border-left:4px solid #2563eb;
  box-shadow:0 3px 10px rgba(15,23,42,.05);
}

.player-name{
  font-size:17px;
  font-weight:bold;
  color:#0f2d5c;
  margin-bottom:10px;
}

.player-club{
  color:#334155;
  font-size:14px;
  margin-bottom:7px;
}

.player-meta{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:6px;
  font-size:12px;
  background:#f1f5f9;
  color:#475569;
}

.badge-country{
  background:#eff6ff;
  color:#1d4ed8;
}

/* BOUTONS */

.back{
  background:#1748a2;
  color:white;
  border:0;
  padding:11px 17px;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
  margin-bottom:15px;
}

.back:hover{
  background:#123a82;
}

/* MESSAGES */

.empty{
  text-align:center;
  padding:30px;
  color:#64748b;
}

/* FOOTER */

footer{
  background:#06152f;
  color:#94a3b8;
  text-align:center;
  padding:25px 15px;
  font-size:13px;
}

footer strong{
  color:white;
}

/* MOBILE */

@media(max-width:650px){

  .header-content{
    padding:28px 15px 24px;
  }

  header h1{
    font-size:25px;
  }

  header p{
    font-size:14px;
  }

  .nav-content{
    overflow-x:auto;
    justify-content:flex-start;
  }

  .nav-btn{
    white-space:nowrap;
  }

  main{
    padding:15px;
  }

  .stats{
    gap:7px;
  }

  .stat{
    padding:14px 5px;
  }

  .stat strong{
    font-size:23px;
  }

  .stat span{
    font-size:11px;
  }

  .controls{
    padding:10px;
  }

  input,
  select{
    width:100%;
    min-width:100%;
  }

  .leagues,
  .players-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>

<div class="header-content">
  <h1>🇫🇷 FRANCE FOOT WORLD 🌍</h1>
  <p>Les joueurs français évoluant à l'étranger</p>
</div>

<nav>
  <div class="nav-content">
    <button class="nav-btn active" id="navHome">🏠 Accueil</button>
    <button class="nav-btn" id="navLeagues">🌍 Championnats</button>
    <button class="nav-btn" id="navPlayers">🇫🇷 Tous les joueurs</button>
  </div>
</nav>

</header>

<main>

<div class="stats">

  <div class="stat">
    <strong id="totalPlayers">0</strong>
    <span>Joueurs français</span>
  </div>

  <div class="stat">
    <strong id="totalLeagues">0</strong>
    <span>Championnats</span>
  </div>

  <div class="stat">
    <strong id="totalCountries">0</strong>
    <span>Pays</span>
  </div>

</div>

<div class="controls">

  <input
    id="search"
    type="search"
    placeholder="🔎 Rechercher un joueur ou un club..."
  >

  <select id="country">
    <option value="">🌍 Tous les pays</option>
  </select>

</div>

<!-- ACCUEIL / CHAMPIONNATS -->

<section id="home">

  <div class="section-title">
    <h2>🌍 Les championnats</h2>
  </div>

  <div id="countries"></div>

</section>

<!-- DETAIL CHAMPIONNAT -->

<section id="details" hidden>

  <button class="back" id="back">
    ← Tous les championnats
  </button>

  <div class="section-title">
    <h2 id="leagueTitle"></h2>
  </div>

  <div id="players" class="players-grid"></div>

</section>

<!-- TOUS LES JOUEURS -->

<section id="allPlayers" hidden>

  <div class="section-title">
    <h2>🇫🇷 Tous les joueurs</h2>
  </div>

  <div id="allPlayersList" class="players-grid"></div>

</section>

<p id="status" class="empty">
  Chargement des joueurs...
</p>

</main>

<footer>
  <strong>France Foot World</strong><br>
  Les Français du football mondial
</footer>

<script>

const API =
"https://script.google.com/macros/s/AKfycbz2jW4B0-gzOPoy2YlR87yg7bgPIP9s_7CPr88h2v_re-rtc94LEph9AhK03_NLk8EfHg/exec";

let joueurs=[];
let selectedLeague=null;
let currentView="home";

const $=id=>document.getElementById(id);

const flags={
  "Angleterre":"🏴",
  "Espagne":"🇪🇸",
  "Allemagne":"🇩🇪",
  "Italie":"🇮🇹",
  "Portugal":"🇵🇹",
  "Belgique":"🇧🇪",
  "Pays-Bas":"🇳🇱",
  "Arabie saoudite":"🇸🇦",
  "Arabie Saoudite":"🇸🇦",
  "États-Unis":"🇺🇸",
  "Etats-Unis":"🇺🇸",
  "Turquie":"🇹🇷",
  "Écosse":"🏴",
  "Ecosse":"🏴",
  "Suisse":"🇨🇭",
  "Autriche":"🇦🇹",
  "Grèce":"🇬🇷",
  "Danemark":"🇩🇰",
  "Norvège":"🇳🇴",
  "Suède":"🇸🇪",
  "Pologne":"🇵🇱",
  "Croatie":"🇭🇷",
  "Serbie":"🇷🇸",
  "Roumanie":"🇷🇴",
  "République tchèque":"🇨🇿",
  "Brésil":"🇧🇷",
  "Argentine":"🇦🇷",
  "Mexique":"🇲🇽",
  "Canada":"🇨🇦",
  "Japon":"🇯🇵",
  "Corée du Sud":"🇰🇷",
  "Australie":"🇦🇺",
  "Qatar":"🇶🇦",
  "Émirats arabes unis":"🇦🇪"
};

function clean(value){
  return String(value ?? "").trim();
}

function getFlag(country){
  return flags[country] || "🌍";
}

function filteredPlayers(){

  const q=$("search")
    .value
    .trim()
    .toLocaleLowerCase("fr");

  const country=$("country").value;

  return joueurs.filter(j=>{

    const matchCountry=
      !country || j.pays===country;

    const text=
      `${j.joueur} ${j.club} ${j.championnat} ${j.pays} ${j.poste}`
      .toLocaleLowerCase("fr");

    const matchSearch=
      !q || text.includes(q);

    return matchCountry && matchSearch;

  });

}

function createPlayerCard(j){

  const card=document.createElement("article");
  card.className="player";

  const name=document.createElement("div");
  name.className="player-name";
  name.textContent=j.joueur;

  const club=document.createElement("div");
  club.className="player-club";
  club.textContent="⚽ "+(j.club || "Club non renseigné");

  const meta=document.createElement("div");
  meta.className="player-meta";

  if(j.poste){

    const poste=document.createElement("span");
    poste.className="badge";
    poste.textContent=j.poste;

    meta.append(poste);

  }

  const league=document.createElement("span");
  league.className="badge";
  league.textContent=j.championnat;

  const country=document.createElement("span");
  country.className="badge badge-country";
  country.textContent=
    getFlag(j.pays)+" "+j.pays;

  meta.append(league,country);

  card.append(name,club,meta);

  return card;

}

function updateStats(){

  $("totalPlayers").textContent=
    joueurs.length;

  $("totalLeagues").textContent=
    new Set(
      joueurs.map(j=>j.pays+"|"+j.championnat)
    ).size;

  $("totalCountries").textContent=
    new Set(
      joueurs.map(j=>j.pays)
    ).size;

}

function updateNavigation(){

  document
    .querySelectorAll(".nav-btn")
    .forEach(btn=>btn.classList.remove("active"));

  if(currentView==="players"){
    $("navPlayers").classList.add("active");
  }else{
    $("navHome").classList.add("active");
  }

}

function render(){

  updateStats();
  updateNavigation();

  const filtered=filteredPlayers();

  $("home").hidden=true;
  $("details").hidden=true;
  $("allPlayers").hidden=true;

  if(currentView==="players"){

    $("allPlayers").hidden=false;
    renderAllPlayers(filtered);
    return;

  }

  if(selectedLeague){

    $("details").hidden=false;
    renderLeague(filtered);
    return;

  }

  $("home").hidden=false;
  renderLeagues(filtered);

}

function renderLeagues(filtered){

  $("countries").replaceChildren();

  const countries=new Map();

  filtered.forEach(j=>{

    if(!countries.has(j.pays)){
      countries.set(j.pays,new Map());
    }

    const leagues=countries.get(j.pays);

    if(!leagues.has(j.championnat)){
      leagues.set(j.championnat,0);
    }

    leagues.set(
      j.championnat,
      leagues.get(j.championnat)+1
    );

  });

  const sortedCountries=
    [...countries.keys()]
    .sort((a,b)=>a.localeCompare(b,"fr"));

  if(!sortedCountries.length){

    const empty=document.createElement("p");
    empty.className="empty";
    empty.textContent=
      "Aucun championnat trouvé.";

    $("countries").append(empty);
    return;

  }

  sortedCountries.forEach(country=>{

    const title=document.createElement("h3");
    title.className="country-title";
    title.textContent=
      `${getFlag(country)} ${country}`;

    const grid=document.createElement("div");
    grid.className="leagues";

    const leagues=
      [...countries.get(country).entries()]
      .sort((a,b)=>a[0].localeCompare(b[0],"fr"));

    leagues.forEach(([league,count])=>{

      const btn=document.createElement("button");
      btn.className="league";

      const top=document.createElement("div");
      top.className="league-top";

      const flag=document.createElement("span");
      flag.className="flag";
      flag.textContent=getFlag(country);

      const counter=document.createElement("span");
      counter.className="count";
      counter.textContent=
        `${count} joueur${count>1?"s":""}`;

      top.append(flag,counter);

      const name=document.createElement("strong");
      name.textContent=league;

      const info=document.createElement("small");
      info.textContent=country;

      btn.append(top,name,info);

      btn.onclick=()=>{

        selectedLeague={
          championnat:league,
          pays:country
        };

        currentView="home";

        render();

        window.scrollTo({
          top:0,
          behavior:"smooth"
        });

      };

      grid.append(btn);

    });

    $("countries").append(title,grid);

  });

}

function renderLeague(filtered){

  const league=selectedLeague;

  $("leagueTitle").textContent=
    `${getFlag(league.pays)} ${league.championnat} — ${league.pays}`;

  $("players").replaceChildren();

  const list=filtered
    .filter(j=>
      j.championnat===league.championnat &&
      j.pays===league.pays
    )
    .sort((a,b)=>
      a.joueur.localeCompare(b.joueur,"fr")
    );

  if(!list.length){

    const empty=document.createElement("p");
    empty.className="empty";
    empty.textContent="Aucun joueur trouvé.";

    $("players").append(empty);
    return;

  }

  list.forEach(j=>{
    $("players").append(
      createPlayerCard(j)
    );
  });

}

function renderAllPlayers(filtered){

  $("allPlayersList").replaceChildren();

  const list=[...filtered]
    .sort((a,b)=>
      a.joueur.localeCompare(b.joueur,"fr")
    );

  if(!list.length){

    const empty=document.createElement("p");
    empty.className="empty";
    empty.textContent="Aucun joueur trouvé.";

    $("allPlayersList").append(empty);
    return;

  }

  list.forEach(j=>{

    $("allPlayersList").append(
      createPlayerCard(j)
    );

  });

}

/* MENU */

$("navHome").onclick=()=>{

  currentView="home";
  selectedLeague=null;

  render();

};

$("navLeagues").onclick=()=>{

  currentView="home";
  selectedLeague=null;

  render();

  document
    .getElementById("home")
    .scrollIntoView({
      behavior:"smooth"
    });

};

$("navPlayers").onclick=()=>{

  currentView="players";
  selectedLeague=null;

  render();

};

/* FILTRES */

$("search")
.addEventListener("input",render);

$("country")
.addEventListener("change",()=>{

  selectedLeague=null;
  render();

});

/* RETOUR */

$("back").onclick=()=>{

  selectedLeague=null;
  currentView="home";

  render();

};

/* CHARGEMENT API */

async function load(){

  try{

    const response=await fetch(API);

    if(!response.ok){
      throw Error("Erreur réseau");
    }

    const data=await response.json();

    if(!Array.isArray(data)){
      throw Error("Données invalides");
    }

    joueurs=data
      .map(j=>({

        joueur:clean(j.joueur),
        club:clean(j.club),
        championnat:clean(j.championnat),
        pays:clean(j.pays),
        poste:clean(j.poste)

      }))
      .filter(j=>
        j.joueur &&
        j.championnat &&
        j.pays
      );

    const countries=
      [...new Set(
        joueurs.map(j=>j.pays)
      )]
      .sort((a,b)=>
        a.localeCompare(b,"fr")
      );

    countries.forEach(p=>{

      const option=
        document.createElement("option");

      option.value=p;
      option.textContent=
        `${getFlag(p)} ${p}`;

      $("country").append(option);

    });

    $("status").textContent=
      joueurs.length
      ? ""
      : "Aucun joueur enregistré pour le moment.";

    render();

  }catch(error){

    console.error(error);

    $("status").textContent=
      "Impossible de charger les joueurs. Vérifie la connexion avec Google Sheets.";

  }

}

load();

</script>

</body>
</html>
